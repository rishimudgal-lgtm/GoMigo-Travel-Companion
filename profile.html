<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | GoMigo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=K2D:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="site.css">
    <script src="site.js" defer></script>
</head>
<body class="app-page profile-page">
<div class="page">
    <aside class="sidebar">
        <a class="sidebar-logo" href="main-menu.html" aria-label="GoMigo home"><img src="main-menu-assets/gomigo-logo.png" alt="GoMigo"></a>
        <nav class="sidebar-nav" aria-label="GoMigo navigation">
            <a href="main-menu.html" class="nav-button" data-nav="home">Home</a>
            <a href="trip-planner.html" class="nav-button" data-nav="plan">Plan Trip</a>
            <a href="my-trips.html" class="nav-button" data-nav="trips">My Trips</a>
            <a href="explore-app.html" class="nav-button" data-nav="explore">Explore</a>
            <a href="saved.html" class="nav-button" data-nav="saved">Saved</a>
            <a href="travel-guide.html" class="nav-button" data-nav="guide">Travel Guide</a>
            <a href="profile.html" class="nav-button active" data-nav="profile">Profile</a>
        </nav>
        <div class="sidebar-quote">Good<br>Trips<br>Happen<br>Here ♡</div>
        <a class="sidebar-profile" href="profile.html">
            <img src="main-menu-assets/profile.png" alt="">
            <div class="profile-text"><h4 data-user-name>Hey, Explorer!</h4><p>Profile &amp; preferences</p></div>
        </a>
        <button class="sign-out-button" type="button" data-sign-out>Sign out</button>
    </aside>

    <main class="main-content content-page">
        <header class="content-page-header">
            <p class="content-eyebrow">MADE FOR YOUR KIND OF TRIP</p>
            <h1>Your travel profile</h1>
            <p>Save a few preferences to make planning feel more personal.</p>
        </header>
        <form class="profile-form profile-page-form" id="profile-form">
            <label for="profile-name">Name</label>
            <input id="profile-name" name="name" autocomplete="name" required>
            <label for="profile-email">Email</label>
            <input id="profile-email" name="email" type="email" autocomplete="email">
            <label for="profile-home">Home city (optional)</label>
            <input id="profile-home" name="home" autocomplete="address-level2" placeholder="e.g. Mumbai">
            <label for="profile-style">Travel style</label>
            <select id="profile-style" name="style">
                <option>Balanced</option><option>Adventure</option><option>Relaxation</option><option>Culture &amp; history</option><option>Budget friendly</option>
            </select>
            <button class="profile-save-button" type="submit">Save preferences</button>
            <button class="profile-sign-out" type="button" data-sign-out>Sign out</button>
        </form>
    </main>
</div>
</body>
</html>
